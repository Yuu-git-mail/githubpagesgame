<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, minimum-scale=1.0">
  <title>倉庫番 - Game Hub</title>
  <link rel="stylesheet" href="../../css/common.css">
  <style>
    .game-stats {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      max-width: 400px;
      margin: 1.0rem auto;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.8rem;
      padding: 0.8rem 1.2rem;
      box-shadow: 0 2px 4px var(--shadow-color);
    }
    .stat-item {
      text-align: center;
    }
    .stat-label {
      font-size: 1.1rem;
      color: var(--text-muted);
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-color);
    }
    .stage-select-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 1.0rem auto;
    }
    .dpad-container {
      width: 100%;
      max-width: 280px;
      margin: 1.5rem auto 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 0.8rem;
    }
    .dpad-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 2.2rem;
      border-radius: 0.8rem;
      height: 5.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      box-shadow: 0 2px 4px var(--shadow-color);
      user-select: none;
      -webkit-user-select: none;
    }
    .dpad-btn:active {
      background-color: var(--accent-color);
      color: var(--accent-text);
      transform: scale(0.95);
    }
    .btn-action-group {
      display: flex;
      gap: 1.0rem;
      justify-content: center;
      width: 100%;
      max-width: 400px;
      margin: 1.0rem auto 0 auto;
    }
    .clear-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 0.8rem;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
      padding: 2.0rem;
      text-align: center;
    }
    .clear-modal.active {
      display: flex;
    }
    .clear-modal h2 {
      font-size: 2.6rem;
      color: #f6ad55;
      margin-bottom: 1.0rem;
    }
  </style>
</head>
<body>

  <header id="game-header" data-title="倉庫番" data-back="../../index.html" data-reset></header>

  <div class="container">
    <!-- ステージ切替バー -->
    <div class="stage-select-bar">
      <button id="btn-prev-stage" class="btn btn-secondary" style="min-height:3.6rem; padding:0.4rem 1.0rem; font-size:1.3rem;">◀ 前の面</button>
      <span id="stage-title" style="font-size:1.6rem; font-weight:bold;">STAGE 1 / 5</span>
      <button id="btn-next-stage" class="btn btn-secondary" style="min-height:3.6rem; padding:0.4rem 1.0rem; font-size:1.3rem;">次の面 ▶</button>
    </div>

    <!-- ゲーム情報ステータス -->
    <div class="game-stats">
      <div class="stat-item">
        <div class="stat-label">移動回数</div>
        <div id="move-count" class="stat-value">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">格納済み</div>
        <div id="target-count" class="stat-value">0 / 0</div>
      </div>
    </div>

    <!-- ゲームキャンバス -->
    <div class="game-container" style="margin: 0.5rem 0;">
      <div class="game-canvas-wrapper">
        <canvas id="sokoban-canvas" class="game-canvas" width="400" height="400"></canvas>
        <div id="clear-modal" class="clear-modal">
          <h2>🎉 STAGE CLEAR!</h2>
          <p class="text-m" style="margin-bottom: 1.5rem;">お見事！すべての荷物を格納しました！</p>
          <button id="btn-next-level-modal" class="btn">次のステージへ</button>
        </div>
      </div>
    </div>

    <!-- アクションボタン（Undo / リセット） -->
    <div class="btn-action-group">
      <button id="btn-undo" class="btn btn-secondary" style="flex:1;">↩ 1手戻す</button>
      <button id="btn-reset-stage" class="btn btn-secondary" style="flex:1;">↻ やり直す</button>
    </div>

    <!-- 十字キー操作パネル -->
    <div class="dpad-container">
      <div></div>
      <button id="btn-up" class="dpad-btn" aria-label="上移動">▲</button>
      <div></div>
      <button id="btn-left" class="dpad-btn" aria-label="左移動">◀</button>
      <div></div>
      <button id="btn-right" class="dpad-btn" aria-label="右移動">▶</button>
      <div></div>
      <button id="btn-down" class="dpad-btn" aria-label="下移動">▼</button>
      <div></div>
    </div>

    <!-- 操作説明 -->
    <div class="instructions-card">
      <h2 class="h2-heading" style="margin-top:0;">📖 遊び方・ルール</h2>
      <p class="text-s">
        ・画面の十字キーボタン、またはキーボードの矢印キー / WASDキーでプレイヤー（🧙）を動かします。<br>
        ・荷物（📦）を押して格納場所（🔴）まで運んでください。<br>
        ・荷物は1つずつ押すことができます。引き寄せることはできません。<br>
        ・すべての荷物を格納場所（⭐）へ配置するとクリアとなります！
      </p>
    </div>
  </div>

  <footer id="game-footer"></footer>
  <script src="../../js/common.js"></script>

  <script>
    // 倉庫番 ステージデータ定義
    // # : 壁
    // . : 格納場所
    // $ : 荷物
    // * : 格納場所に置かれた荷物
    // @ : プレイヤー
    // + : 格納場所にいるプレイヤー
    // ' ': 空白
    const STAGES = [
      // Stage 1
      [
        "  ##### ",
        "###   # ",
        "# $ # # ",
        "# #   # ",
        "# . . # ",
        "#  $@ # ",
        "####### "
      ],
      // Stage 2
      [
        "######  ",
        "#  . #  ",
        "# #$ #  ",
        "# $  #  ",
        "# .@ #  ",
        "######  "
      ],
      // Stage 3
      [
        "########",
        "#@ $ . #",
        "# $#.# #",
        "#      #",
        "########"
      ],
      // Stage 4
      [
        "  ####  ",
        "###  ###",
        "# $  $ #",
        "# .##. #",
        "## @  ##",
        " #######"
      ],
      // Stage 5
      [
        "######  ",
        "#    #  ",
        "# $$.#  ",
        "# .@ #  ",
        "# $ .#  ",
        "######  "
      ]
    ];

    let currentStageIndex = 0;
    let grid = [];
    let playerPos = { r: 0, c: 0 };
    let moveCount = 0;
    let history = [];
    let isCleared = false;

    const canvas = document.getElementById('sokoban-canvas');
    const ctx = canvas.getContext('2d');
    const stageTitle = document.getElementById('stage-title');
    const moveCountElem = document.getElementById('move-count');
    const targetCountElem = document.getElementById('target-count');
    const clearModal = document.getElementById('clear-modal');

    // ステージ読み込み
    function loadStage(index) {
      currentStageIndex = index;
      const rawMap = STAGES[index];
      const rows = rawMap.length;
      let cols = 0;
      for (let r = 0; r < rows; r++) {
        if (rawMap[r].length > cols) cols = rawMap[r].length;
      }

      grid = [];
      history = [];
      moveCount = 0;
      isCleared = false;
      clearModal.classList.remove('active');

      for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let c = 0; c < cols; c++) {
          const char = rawMap[r][c] || ' ';
          grid[r][c] = char;
          if (char === '@' || char === '+') {
            playerPos = { r, c };
          }
        }
      }

      stageTitle.textContent = `STAGE ${currentStageIndex + 1} / ${STAGES.length}`;
      updateStats();
      draw();
    }

    // 描画処理
    function draw() {
      const rows = grid.length;
      const cols = grid[0].length;

      // キャンバスを正方形に調整
      const maxDim = Math.max(rows, cols);
      const cellSize = Math.floor(canvas.width / maxDim);
      const offsetX = Math.floor((canvas.width - cols * cellSize) / 2);
      const offsetY = Math.floor((canvas.height - rows * cellSize) / 2);

      // 背景クリア
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--card-bg').trim() || '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = offsetX + c * cellSize;
          const y = offsetY + r * cellSize;
          const cell = grid[r][c];

          // 床描画
          if (cell !== ' ') {
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(x, y, cellSize, cellSize);
            ctx.strokeStyle = '#cbd5e1';
            ctx.strokeRect(x, y, cellSize, cellSize);
          }

          // 各要素の描画
          if (cell === '#') {
            // 壁
            ctx.fillStyle = '#475569';
            ctx.fillRect(x + 1, y + 1, cellSize - 2, cellSize - 2);
            ctx.fillStyle = '#334155';
            ctx.fillRect(x + 3, y + 3, cellSize - 6, cellSize - 6);
          } else if (cell === '.') {
            // 格納場所
            drawTarget(x, y, cellSize, false);
          } else if (cell === '$') {
            // 荷物
            drawBox(x, y, cellSize, false);
          } else if (cell === '*') {
            // 格納場所の荷物
            drawTarget(x, y, cellSize, true);
            drawBox(x, y, cellSize, true);
          } else if (cell === '@') {
            // プレイヤー
            drawPlayer(x, y, cellSize);
          } else if (cell === '+') {
            // 格納場所のプレイヤー
            drawTarget(x, y, cellSize, false);
            drawPlayer(x, y, cellSize);
          }
        }
      }
    }

    function drawTarget(x, y, size, isFilled) {
      const cx = x + size / 2;
      const cy = y + size / 2;
      const r = size * 0.2;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = isFilled ? '#16a34a' : '#ef4444';
      ctx.fill();
    }

    function drawBox(x, y, size, isOnTarget) {
      const pad = size * 0.1;
      const bSize = size - pad * 2;
      ctx.fillStyle = isOnTarget ? '#22c55e' : '#d97706';
      ctx.fillRect(x + pad, y + pad, bSize, bSize);
      ctx.strokeStyle = isOnTarget ? '#15803d' : '#b45309';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + pad, y + pad, bSize, bSize);

      // 対角線X模様
      ctx.beginPath();
      ctx.moveTo(x + pad, y + pad);
      ctx.lineTo(x + pad + bSize, y + pad + bSize);
      ctx.moveTo(x + pad + bSize, y + pad);
      ctx.lineTo(x + pad, y + pad + bSize);
      ctx.stroke();
    }

    function drawPlayer(x, y, size) {
      const cx = x + size / 2;
      const cy = y + size / 2;
      const fontSize = Math.floor(size * 0.7);
      ctx.font = `${fontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🧙', cx, cy);
    }

    // 移動制御
    function move(dr, dc) {
      if (isCleared) return;

      const nr = playerPos.r + dr;
      const nc = playerPos.c + dc;
      if (nr < 0 || nr >= grid.length || nc < 0 || nc >= grid[0].length) return;

      const destCell = grid[nr][nc];

      if (destCell === '#') return; // 壁

      let pushedBox = false;

      if (destCell === '$' || destCell === '*') {
        // 荷物を押し出せるかチェック
        const nnr = nr + dr;
        const nnc = nc + dc;
        if (nnr < 0 || nnr >= grid.length || nnc < 0 || nnc >= grid[0].length) return;
        const boxDestCell = grid[nnr][nnc];

        if (boxDestCell === ' ' || boxDestCell === '.') {
          // 荷物移動可能
          pushedBox = true;
          // 状態保存
          saveHistory();

          // 荷物の移動
          grid[nnr][nnc] = (boxDestCell === '.') ? '*' : '$';
          grid[nr][nc] = (destCell === '*') ? '.' : ' ';
        } else {
          return; // 押せない
        }
      } else {
        saveHistory();
      }

      // プレイヤーの移動
      const curCell = grid[playerPos.r][playerPos.c];
      grid[playerPos.r][playerPos.c] = (curCell === '+') ? '.' : ' ';
      grid[nr][nc] = (grid[nr][nc] === '.') ? '+' : '@';
      playerPos = { r: nr, c: nc };

      moveCount++;
      updateStats();
      draw();
      checkWin();
    }

    function saveHistory() {
      const snapshot = grid.map(row => [...row]);
      history.push({
        grid: snapshot,
        playerPos: { ...playerPos },
        moveCount: moveCount
      });
    }

    function undo() {
      if (history.length === 0 || isCleared) return;
      const lastState = history.pop();
      grid = lastState.grid;
      playerPos = lastState.playerPos;
      moveCount = lastState.moveCount;
      updateStats();
      draw();
    }

    function updateStats() {
      let totalTargets = 0;
      let filledTargets = 0;

      for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[0].length; c++) {
          const cell = grid[r][c];
          if (cell === '.' || cell === '+') totalTargets++;
          if (cell === '*') {
            totalTargets++;
            filledTargets++;
          }
        }
      }

      moveCountElem.textContent = moveCount;
      targetCountElem.textContent = `${filledTargets} / ${totalTargets}`;
    }

    function checkWin() {
      let remainingBoxes = 0;
      for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[0].length; c++) {
          if (grid[r][c] === '$') {
            remainingBoxes++;
          }
        }
      }

      if (remainingBoxes === 0) {
        isCleared = true;
        setTimeout(() => {
          clearModal.classList.add('active');
        }, 200);
      }
    }

    // リセット関数 (要求仕様: window.resetGame)
    window.resetGame = function() {
      loadStage(currentStageIndex);
    };

    // イベントリスナー設定
    document.getElementById('btn-up').addEventListener('click', () => move(-1, 0));
    document.getElementById('btn-down').addEventListener('click', () => move(1, 0));
    document.getElementById('btn-left').addEventListener('click', () => move(0, -1));
    document.getElementById('btn-right').addEventListener('click', () => move(0, 1));
    document.getElementById('btn-undo').addEventListener('click', undo);
    document.getElementById('btn-reset-stage').addEventListener('click', window.resetGame);

    document.getElementById('btn-prev-stage').addEventListener('click', () => {
      let nextIndex = currentStageIndex - 1;
      if (nextIndex < 0) nextIndex = STAGES.length - 1;
      loadStage(nextIndex);
    });

    document.getElementById('btn-next-stage').addEventListener('click', () => {
      let nextIndex = (currentStageIndex + 1) % STAGES.length;
      loadStage(nextIndex);
    });

    document.getElementById('btn-next-level-modal').addEventListener('click', () => {
      let nextIndex = (currentStageIndex + 1) % STAGES.length;
      loadStage(nextIndex);
    });

    // キーボード操作
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { move(-1, 0); e.preventDefault(); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { move(1, 0); e.preventDefault(); }
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) { move(0, -1); e.preventDefault(); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { move(0, 1); e.preventDefault(); }
      else if (e.code === 'KeyZ' || e.code === 'KeyU') { undo(); }
      else if (e.code === 'KeyR') { window.resetGame(); }
    });

    // 初期化
    loadStage(0);
  </script>
</body>
</html>
