<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, minimum-scale=1.0">
  <title>2048 - Game Hub</title>
  <link rel="stylesheet" href="../../css/common.css">
  <style>
    .score-container {
      display: flex;
      justify-content: space-between;
      gap: 1.0rem;
      width: 100%;
      max-width: 360px;
      margin-bottom: 1.0rem;
    }
    .score-box {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.8rem;
      padding: 0.8rem;
      text-align: center;
      box-shadow: 0 2px 4px var(--shadow-color);
    }
    .score-title {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .score-num {
      font-size: 2.0rem;
      font-weight: bold;
      color: var(--accent-color);
    }
    .game-modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      border-radius: 0.8rem;
      z-index: 20;
    }
    .game-modal h2 {
      font-size: 3.0rem;
      margin-bottom: 0.5rem;
    }
    .game-modal p {
      font-size: 1.6rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <header id="game-header" data-title="2048" data-back="../../index.html" data-reset></header>

  <div class="container">
    <div class="game-container">
      <div class="score-container">
        <div class="score-box">
          <div class="score-title">SCORE</div>
          <div class="score-num" id="current-score">0</div>
        </div>
        <div class="score-box">
          <div class="score-title">BEST</div>
          <div class="score-num" id="best-score">0</div>
        </div>
      </div>

      <div class="game-canvas-wrapper">
        <canvas id="game-canvas" width="360" height="360" class="game-canvas"></canvas>
        <div id="game-over-modal" class="game-modal" style="display: none;">
          <h2 id="modal-title" style="color: #ff4d4d;">GAME OVER</h2>
          <p id="modal-msg">動かせるパネルがありません！</p>
          <div style="display: flex; gap: 1rem;">
            <button class="btn" id="btn-modal-keep" style="display:none;" onclick="hideModal()">継続する</button>
            <button class="btn" onclick="window.resetGame()">もう一度プレイ</button>
          </div>
        </div>
      </div>

      <!-- 操作ボタンパネル -->
      <div class="controls-panel">
        <div></div>
        <button class="control-btn" id="btn-up" aria-label="上">▲</button>
        <div></div>
        <button class="control-btn" id="btn-left" aria-label="左">◄</button>
        <button class="control-btn" id="btn-down" aria-label="下">▼</button>
        <button class="control-btn" id="btn-right" aria-label="右">►</button>
        <div></div>
        <div></div>
        <div></div>
      </div>

      <div class="instructions-card">
        <h2 class="h2-heading">💡 遊び方</h2>
        <p class="text-s">
          ・<b>スライド操作</b>: フリック(スワイプ) / 画面矢印ボタン / キーボード方向キー(↑↓←→)<br>
          ・<b>合体ルール</b>: 同じ数字のパネルがぶつかると合体して2倍の数値になります（2+2=4, 4+4=8...）<br>
          ・<b>目的</b>: 2048タイルの完成を目指します！2048達成後もハイスコアを目指して継続プレイ可能です。
        </p>
      </div>
    </div>
  </div>

  <footer id="game-footer"></footer>
  <script src="../../js/common.js"></script>
  <script>
    // ==========================================
    // 2048 ゲームエンジン
    // ==========================================
    const GRID_SIZE = 4;
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const CANVAS_SIZE = 360;
    const PADDING = 12;
    const CELL_SIZE = (CANVAS_SIZE - PADDING * (GRID_SIZE + 1)) / GRID_SIZE; // 75px

    // パネルカラー定義
    const TILE_COLORS = {
      2:    { bg: '#eee4da', text: '#776e65' },
      4:    { bg: '#ede0c8', text: '#776e65' },
      8:    { bg: '#f2b179', text: '#f9f6f2' },
      16:   { bg: '#f59563', text: '#f9f6f2' },
      32:   { bg: '#f67c5f', text: '#f9f6f2' },
      64:   { bg: '#f65e3b', text: '#f9f6f2' },
      128:  { bg: '#edcf72', text: '#f9f6f2' },
      256:  { bg: '#edcc61', text: '#f9f6f2' },
      512:  { bg: '#edc850', text: '#f9f6f2' },
      1024: { bg: '#edc53f', text: '#f9f6f2' },
      2048: { bg: '#edc22e', text: '#f9f6f2' },
      4096: { bg: '#3c3a32', text: '#f9f6f2' },
      8192: { bg: '#1c1b18', text: '#f9f6f2' }
    };

    let board = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('game2048_best') || '0', 10);
    let gameOver = false;
    let won2048 = false;
    let hasContinuedAfterWin = false;

    // アニメーション用
    let animations = []; // { fromR, fromC, toR, toC, val, progress }
    let animReqId = null;

    function initBoard() {
      board = Array.from({ length: GRID_SIZE }, () => new Array(GRID_SIZE).fill(0));
      score = 0;
      gameOver = false;
      won2048 = false;
      hasContinuedAfterWin = false;
      animations = [];

      spawnRandomTile();
      spawnRandomTile();

      updateUI();
      draw();
    }

    function resetGame() {
      document.getElementById('game-over-modal').style.display = 'none';
      document.getElementById('btn-modal-keep').style.display = 'none';
      initBoard();
    }
    window.resetGame = resetGame;

    function hideModal() {
      document.getElementById('game-over-modal').style.display = 'none';
      hasContinuedAfterWin = true;
    }

    function updateUI() {
      document.getElementById('current-score').textContent = score;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('game2048_best', bestScore.toString());
      }
      document.getElementById('best-score').textContent = bestScore;
    }

    function spawnRandomTile() {
      const emptyCells = [];
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (board[r][c] === 0) {
            emptyCells.push({ r, c });
          }
        }
      }

      if (emptyCells.length > 0) {
        const spot = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    // 移動制御
    function move(direction) {
      if (gameOver) return;

      // direction: 0=Up, 1=Right, 2=Down, 3=Left
      let moved = false;
      const newBoard = Array.from({ length: GRID_SIZE }, () => new Array(GRID_SIZE).fill(0));
      let pointsEarned = 0;

      // 各ラインごとに処理
      for (let i = 0; i < GRID_SIZE; i++) {
        // ライン抽出
        let line = [];
        for (let j = 0; j < GRID_SIZE; j++) {
          let r = (direction === 0 || direction === 2) ? (direction === 0 ? j : GRID_SIZE - 1 - j) : i;
          let c = (direction === 1 || direction === 3) ? (direction === 3 ? j : GRID_SIZE - 1 - j) : i;
          line.push(board[r][c]);
        }

        // スライド & マッチング
        const filtered = line.filter(val => val !== 0);
        const newLine = [];
        let skipNext = false;

        for (let k = 0; k < filtered.length; k++) {
          if (skipNext) {
            skipNext = false;
            continue;
          }
          if (k + 1 < filtered.length && filtered[k] === filtered[k + 1]) {
            const mergedVal = filtered[k] * 2;
            newLine.push(mergedVal);
            pointsEarned += mergedVal;
            if (mergedVal === 2048 && !won2048) {
              won2048 = true;
            }
            skipNext = true;
          } else {
            newLine.push(filtered[k]);
          }
        }

        while (newLine.length < GRID_SIZE) {
          newLine.push(0);
        }

        // 新ボードに配置
        for (let j = 0; j < GRID_SIZE; j++) {
          let r = (direction === 0 || direction === 2) ? (direction === 0 ? j : GRID_SIZE - 1 - j) : i;
          let c = (direction === 1 || direction === 3) ? (direction === 3 ? j : GRID_SIZE - 1 - j) : i;
          newBoard[r][c] = newLine[j];
          if (board[r][c] !== newBoard[r][c]) {
            moved = true;
          }
        }
      }

      if (moved) {
        board = newBoard;
        score += pointsEarned;
        spawnRandomTile();
        updateUI();
        draw();

        // 2048勝利判定
        if (won2048 && !hasContinuedAfterWin) {
          showVictoryModal();
        } else if (checkGameOver()) {
          showGameOverModal();
        }
      }
    }

    function checkGameOver() {
      // 空きマスのチェック
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (board[r][c] === 0) return false;
        }
      }

      // 隣接マス同数チェック
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const val = board[r][c];
          if (r + 1 < GRID_SIZE && board[r + 1][c] === val) return false;
          if (c + 1 < GRID_SIZE && board[r][c + 1] === val) return false;
        }
      }

      return true;
    }

    function showVictoryModal() {
      const modal = document.getElementById('game-over-modal');
      document.getElementById('modal-title').textContent = '🎉 2048 ACHIEVED!';
      document.getElementById('modal-title').style.color = '#eab308';
      document.getElementById('modal-msg').textContent = 'おめでとうございます！2048タイルを完成させました！';
      document.getElementById('btn-modal-keep').style.display = 'inline-block';
      modal.style.display = 'flex';
    }

    function showGameOverModal() {
      gameOver = true;
      const modal = document.getElementById('game-over-modal');
      document.getElementById('modal-title').textContent = 'GAME OVER';
      document.getElementById('modal-title').style.color = '#ff4d4d';
      document.getElementById('modal-msg').textContent = '動かせるパネルがなくなりました！';
      document.getElementById('btn-modal-keep').style.display = 'none';
      modal.style.display = 'flex';
    }

    // 描画関数
    function draw() {
      ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      // 背景グリッド枠
      ctx.fillStyle = '#bbada0';
      ctx.beginPath();
      ctx.roundRect(0, 0, CANVAS_SIZE, CANVAS_SIZE, 12);
      ctx.fill();

      // 各セル描画
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const x = PADDING + c * (CELL_SIZE + PADDING);
          const y = PADDING + r * (CELL_SIZE + PADDING);
          const val = board[r][c];

          // 空セル枠描画
          ctx.fillStyle = 'rgba(238, 228, 218, 0.35)';
          ctx.beginPath();
          ctx.roundRect(x, y, CELL_SIZE, CELL_SIZE, 8);
          ctx.fill();

          if (val > 0) {
            drawTile(x, y, val);
          }
        }
      }
    }

    function drawTile(x, y, val) {
      const style = TILE_COLORS[val] || { bg: '#3c3a32', text: '#f9f6f2' };

      ctx.save();
      ctx.fillStyle = style.bg;
      ctx.beginPath();
      ctx.roundRect(x, y, CELL_SIZE, CELL_SIZE, 8);
      ctx.fill();

      ctx.fillStyle = style.text;
      ctx.font = val >= 1024 ? 'bold 24px sans-serif' : (val >= 128 ? 'bold 28px sans-serif' : 'bold 34px sans-serif');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(val.toString(), x + CELL_SIZE / 2, y + CELL_SIZE / 2 + 2);

      ctx.restore();
    }

    // ボタンリスナー
    document.getElementById('btn-up').addEventListener('click', () => move(0));
    document.getElementById('btn-right').addEventListener('click', () => move(1));
    document.getElementById('btn-down').addEventListener('click', () => move(2));
    document.getElementById('btn-left').addEventListener('click', () => move(3));

    // キーボード操作
    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': move(0); break;
        case 'ArrowRight': case 'd': case 'D': move(1); break;
        case 'ArrowDown': case 's': case 'S': move(2); break;
        case 'ArrowLeft': case 'a': case 'A': move(3); break;
      }
    });

    // フリック・スワイプジェスチャー操作
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;

        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);

        if (Math.max(absDx, absDy) > 25) { // 25px threshold
          if (absDx > absDy) {
            if (dx > 0) move(1); // Right
            else move(3); // Left
          } else {
            if (dy > 0) move(2); // Down
            else move(0); // Up
          }
        }
      }
    }, { passive: true });

    // 初期化
    resetGame();
  </script>
</body>
</html>
