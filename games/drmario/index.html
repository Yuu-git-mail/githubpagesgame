<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, minimum-scale=1.0">
  <title>Dr.マリオ - Dr. Mario Game</title>
  <link rel="stylesheet" href="../../css/common.css">
  <style>
    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .status-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 16px;
      box-shadow: 0 2px 4px var(--shadow-color);
    }

    .status-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-label {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: bold;
    }

    .status-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .status-value.virus-count {
      color: #ef4444;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: center;
    }

    canvas#marioCanvas {
      background-color: #0f172a;
      border: 2px solid var(--canvas-border);
      border-radius: 8px;
      box-shadow: 0 4px 10px var(--shadow-color);
      max-width: 100%;
      height: auto;
      touch-action: none;
    }

    .touch-controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .control-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .ctrl-btn {
      flex: 1;
      height: 52px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1.8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      box-shadow: 0 2px 4px var(--shadow-color);
      cursor: pointer;
    }

    .ctrl-btn:active, .ctrl-btn.active {
      background: var(--accent-color);
      color: var(--accent-text);
      transform: scale(0.96);
    }

    .ctrl-btn.drop-btn {
      background: #ef4444;
      color: #ffffff;
      border-color: #dc2626;
    }

    .ctrl-btn.drop-btn:active {
      background: #b91c1c;
    }

    .game-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.82);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
    }

    .overlay-title {
      font-size: 2.8rem;
      font-weight: bold;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .overlay-title.game-over { color: #ef4444; }
    .overlay-title.clear { color: #22c55e; }

    .overlay-score {
      font-size: 1.6rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- 共通ヘッダー -->
  <header id="game-header" data-title="Dr.マリオ" data-back="../../index.html" data-reset></header>

  <main class="container">
    <div class="game-area">
      <!-- ステータス表示パネル -->
      <div class="status-panel">
        <div class="status-item">
          <span class="status-label">SCORE</span>
          <span id="scoreVal" class="status-value">0</span>
        </div>
        <div class="status-item">
          <span class="status-label">VIRUS</span>
          <span id="virusVal" class="status-value virus-count">0</span>
        </div>
        <div class="status-item">
          <span class="status-label">NEXT</span>
          <canvas id="nextCanvas" width="60" height="40" style="background:transparent;"></canvas>
        </div>
      </div>

      <!-- メインキャンバスエリア -->
      <div class="canvas-container">
        <canvas id="marioCanvas" width="320" height="640"></canvas>
        <div id="gameOverlay" class="game-overlay" style="display: none;">
          <div id="overlayTitle" class="overlay-title">STAGE CLEAR!</div>
          <div id="finalScore" class="overlay-score">Score: 0</div>
          <button class="btn" onclick="window.resetGame()">もう一度遊ぶ</button>
        </div>
      </div>

      <!-- スマホ用タッチ操作ボタン -->
      <div class="touch-controls">
        <div class="control-row">
          <button id="btnLeft" class="ctrl-btn" aria-label="左移動">←</button>
          <button id="btnRotate" class="ctrl-btn" aria-label="回転">🔄 回転</button>
          <button id="btnRight" class="ctrl-btn" aria-label="右移動">→</button>
        </div>
        <div class="control-row">
          <button id="btnSoftDrop" class="ctrl-btn" aria-label="速落下">↓</button>
          <button id="btnHardDrop" class="ctrl-btn drop-btn" aria-label="一気落下">⇓ 落下</button>
        </div>
      </div>

      <!-- 操作説明 -->
      <div class="instructions-card">
        <h2 class="h2-heading" style="margin-top:0;">操作方法</h2>
        <p class="text-m">
          ・<strong>← / →</strong>: 左右移動<br>
          ・<strong>🔄</strong> (または <strong>Z / X / ArrowUp</strong>): カプセルの向きを回転<br>
          ・<strong>↓</strong> (または <strong>ArrowDown</strong>): ソフトドロップ<br>
          ・<strong>⇓</strong> (または <strong>Space</strong>): ハードドロップ（一気に落下）<br>
          ・ウイルスやカプセルを<strong>縦または横に同色4つ以上</strong>揃えると消滅！
        </p>
      </div>
    </div>
  </main>

  <!-- 共通フッター -->
  <footer id="game-footer"></footer>

  <script src="../../js/common.js"></script>
  <script>
    (function() {
      // --- 定数 ---
      const COLS = 8;
      const ROWS = 16;
      const CELL_SIZE = 40; // 320 / 8

      // 色の定義 (1: Red, 2: Blue, 3: Yellow)
      const COLOR_MAP = {
        1: { name: 'red', bg: '#ef4444', border: '#b91c1c', eye: '#7f1d1d' },
        2: { name: 'blue', bg: '#3b82f6', border: '#1d4ed8', eye: '#1e3a8a' },
        3: { name: 'yellow', bg: '#eab308', border: '#a16207', eye: '#713f12' }
      };

      // セル状態の種類
      // type: 'empty' | 'virus' | 'capsule'
      // color: 1 | 2 | 3

      let board = [];
      let currentCapsule = null;
      let nextCapsule = null;
      let score = 0;
      let virusCount = 0;
      let isGameOver = false;
      let isClear = false;
      let isProcessing = false;
      let dropInterval = 800;
      let lastDropTime = 0;
      let animationFrameId = null;

      const canvas = document.getElementById('marioCanvas');
      const ctx = canvas.getContext('2d');
      const nextCanvas = document.getElementById('nextCanvas');
      const nextCtx = nextCanvas.getContext('2d');
      const scoreVal = document.getElementById('scoreVal');
      const virusVal = document.getElementById('virusVal');
      const overlay = document.getElementById('gameOverlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const finalScore = document.getElementById('finalScore');

      // --- カプセル生成 ---
      function createRandomCapsule() {
        return {
          c1: Math.floor(Math.random() * 3) + 1,
          c2: Math.floor(Math.random() * 3) + 1,
          x: 3, // スポーン位置 (列 3, 4)
          y: 0,
          rot: 0 // 0: 横 (c1, c2), 1: 縦 (c1/c2), 2: 横 (c2, c1), 3: 縦 (c2/c1)
        };
      }

      // カプセルの2つのパーツの位置を返す [ {x, y, color}, {x, y, color} ]
      function getCapsuleParts(capsule) {
        const { x, y, rot, c1, c2 } = capsule;
        if (rot === 0) {
          return [{ x, y, color: c1 }, { x: x + 1, y, color: c2 }];
        } else if (rot === 1) {
          return [{ x, y, color: c1 }, { x, y: y - 1, color: c2 }];
        } else if (rot === 2) {
          return [{ x, y, color: c2 }, { x: x + 1, y, color: c1 }];
        } else {
          return [{ x, y, color: c2 }, { x, y: y - 1, color: c1 }];
        }
      }

      // --- 初期化 / リセット ---
      window.resetGame = function() {
        board = Array.from({ length: ROWS }, () =>
          Array.from({ length: COLS }, () => ({ type: 'empty', color: 0 }))
        );
        score = 0;
        isGameOver = false;
        isClear = false;
        isProcessing = false;
        scoreVal.textContent = '0';
        overlay.style.display = 'none';

        // ウイルスの配置 (14個)
        generateViruses(14);
        virusVal.textContent = virusCount;

        nextCapsule = createRandomCapsule();
        spawnCapsule();

        lastDropTime = performance.now();
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        requestAnimationFrame(gameLoop);
      };

      function generateViruses(count) {
        virusCount = 0;
        let placed = 0;
        // 行 6～15 のエリアにランダム配置
        while (placed < count) {
          const r = Math.floor(Math.random() * 10) + 6;
          const c = Math.floor(Math.random() * COLS);
          if (board[r][c].type === 'empty') {
            const color = Math.floor(Math.random() * 3) + 1;

            // 事前に同色4連にならないか簡単チェック
            board[r][c] = { type: 'virus', color };
            const matches = checkFourMatches();
            if (matches.length > 0) {
              board[r][c] = { type: 'empty', color: 0 }; // リセット
            } else {
              placed++;
              virusCount++;
            }
          }
        }
      }

      function spawnCapsule() {
        currentCapsule = nextCapsule;
        nextCapsule = createRandomCapsule();
        drawNextCapsule();

        if (!canMove(currentCapsule)) {
          triggerGameOver();
        }
      }

      function triggerGameOver() {
        isGameOver = true;
        overlayTitle.textContent = 'GAME OVER';
        overlayTitle.className = 'overlay-title game-over';
        finalScore.textContent = `Score: ${score}`;
        overlay.style.display = 'flex';
      }

      function triggerClear() {
        isClear = true;
        isGameOver = true;
        overlayTitle.textContent = 'STAGE CLEAR!';
        overlayTitle.className = 'overlay-title clear';
        finalScore.textContent = `Score: ${score}`;
        overlay.style.display = 'flex';
      }

      // --- 移動可能判定 ---
      function canMove(capsule) {
        const parts = getCapsuleParts(capsule);
        for (const p of parts) {
          if (p.x < 0 || p.x >= COLS || p.y >= ROWS) return false;
          if (p.y >= 0 && board[p.y][p.x].type !== 'empty') return false;
        }
        return true;
      }

      // --- 操作 ---
      function moveLeft() {
        if (isGameOver || isProcessing || !currentCapsule) return;
        const next = { ...currentCapsule, x: currentCapsule.x - 1 };
        if (canMove(next)) currentCapsule.x--;
      }

      function moveRight() {
        if (isGameOver || isProcessing || !currentCapsule) return;
        const next = { ...currentCapsule, x: currentCapsule.x + 1 };
        if (canMove(next)) currentCapsule.x++;
      }

      function rotate() {
        if (isGameOver || isProcessing || !currentCapsule) return;
        const nextRot = (currentCapsule.rot + 1) % 4;
        let testCap = { ...currentCapsule, rot: nextRot };

        if (canMove(testCap)) {
          currentCapsule.rot = nextRot;
        } else {
          // 壁キック試行
          testCap.x--;
          if (canMove(testCap)) {
            currentCapsule.x--;
            currentCapsule.rot = nextRot;
          } else {
            testCap.x += 2;
            if (canMove(testCap)) {
              currentCapsule.x++;
              currentCapsule.rot = nextRot;
            }
          }
        }
      }

      function softDrop() {
        if (isGameOver || isProcessing || !currentCapsule) return;
        const next = { ...currentCapsule, y: currentCapsule.y + 1 };
        if (canMove(next)) {
          currentCapsule.y++;
          score += 1;
          scoreVal.textContent = score;
          lastDropTime = performance.now();
        } else {
          lockCapsule();
        }
      }

      function hardDrop() {
        if (isGameOver || isProcessing || !currentCapsule) return;
        let dropCount = 0;
        while (true) {
          const next = { ...currentCapsule, y: currentCapsule.y + 1 };
          if (canMove(next)) {
            currentCapsule.y++;
            dropCount++;
          } else {
            break;
          }
        }
        score += dropCount * 2;
        scoreVal.textContent = score;
        lockCapsule();
      }

      // --- 固定＆消滅連鎖ループ ---
      async function lockCapsule() {
        isProcessing = true;
        const parts = getCapsuleParts(currentCapsule);
        for (const p of parts) {
          if (p.y >= 0 && p.y < ROWS) {
            board[p.y][p.x] = { type: 'capsule', color: p.color };
          }
        }
        currentCapsule = null;
        draw();

        await processMatchesAndGravity();

        if (virusCount <= 0) {
          triggerClear();
        } else if (!isGameOver) {
          spawnCapsule();
          isProcessing = false;
          lastDropTime = performance.now();
        }
      }

      async function processMatchesAndGravity() {
        while (true) {
          // 1. 落下適用
          const dropped = applyGravity();
          if (dropped) {
            draw();
            await sleep(120);
          }

          // 2. 4つ以上マッチ検索
          const matches = checkFourMatches();
          if (matches.length === 0) {
            break;
          }

          // 消去スコア & ウイルス消去カウント
          let erasedViruses = 0;
          for (const m of matches) {
            if (board[m.r][m.c].type === 'virus') {
              erasedViruses++;
            }
          }

          virusCount -= erasedViruses;
          if (virusCount < 0) virusCount = 0;
          virusVal.textContent = virusCount;

          score += matches.length * 100 + erasedViruses * 200;
          scoreVal.textContent = score;

          // 点滅アニメーション
          await animateErase(matches);

          // セル削除
          for (const m of matches) {
            board[m.r][m.c] = { type: 'empty', color: 0 };
          }

          draw();
          await sleep(120);
        }
      }

      function applyGravity() {
        let moved = false;
        // 下から上に向かって浮いているカプセル片を自然落下
        for (let c = 0; c < COLS; c++) {
          for (let r = ROWS - 2; r >= 0; r--) {
            if (board[r][c].type === 'capsule' && board[r + 1][c].type === 'empty') {
              let targetR = r;
              while (targetR + 1 < ROWS && board[targetR + 1][c].type === 'empty') {
                targetR++;
              }
              board[targetR][c] = board[r][c];
              board[r][c] = { type: 'empty', color: 0 };
              moved = true;
            }
          }
        }
        return moved;
      }

      function checkFourMatches() {
        const toErase = new Set();

        // 1. 横方向の判定
        for (let r = 0; r < ROWS; r++) {
          let count = 1;
          for (let c = 0; c < COLS; c++) {
            if (c < COLS - 1 && board[r][c].type !== 'empty' && board[r][c].color === board[r][c + 1].color) {
              count++;
            } else {
              if (count >= 4) {
                for (let k = c - count + 1; k <= c; k++) {
                  toErase.add(`${r},${k}`);
                }
              }
              count = 1;
            }
          }
        }

        // 2. 縦方向の判定
        for (let c = 0; c < COLS; c++) {
          let count = 1;
          for (let r = 0; r < ROWS; r++) {
            if (r < ROWS - 1 && board[r][c].type !== 'empty' && board[r][c].color === board[r + 1][c].color) {
              count++;
            } else {
              if (count >= 4) {
                for (let k = r - count + 1; k <= r; k++) {
                  toErase.add(`${k},${c}`);
                }
              }
              count = 1;
            }
          }
        }

        return Array.from(toErase).map(str => {
          const [r, c] = str.split(',').map(Number);
          return { r, c };
        });
      }

      async function animateErase(cells) {
        for (let i = 0; i < 3; i++) {
          draw(cells, i % 2 === 0);
          await sleep(80);
        }
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      // --- 描画関数 ---
      function drawVirus(context, x, y, colorId, isHighlight = false) {
        const color = COLOR_MAP[colorId];
        if (!color) return;
        const radius = CELL_SIZE / 2 - 3;
        const cx = x + CELL_SIZE / 2;
        const cy = y + CELL_SIZE / 2;

        context.save();
        if (isHighlight) {
          context.fillStyle = '#ffffff';
          context.beginPath();
          context.arc(cx, cy, radius + 2, 0, Math.PI * 2);
          context.fill();
        } else {
          // ウイルス描画: トゲ付きの球体
          context.fillStyle = color.bg;
          context.strokeStyle = color.border;
          context.lineWidth = 2;

          // トゲの描画
          context.beginPath();
          for (let i = 0; i < 8; i++) {
            const angle = (i * Math.PI) / 4;
            const spikeX = cx + Math.cos(angle) * (radius + 3);
            const spikeY = cy + Math.sin(angle) * (radius + 3);
            context.lineTo(spikeX, spikeY);
          }
          context.closePath();
          context.fill();

          // 本体
          context.beginPath();
          context.arc(cx, cy, radius, 0, Math.PI * 2);
          context.fill();
          context.stroke();

          // 目 (ちょっと悪そうな目)
          context.fillStyle = '#ffffff';
          context.beginPath();
          context.arc(cx - 5, cy - 3, 4, 0, Math.PI * 2);
          context.arc(cx + 5, cy - 3, 4, 0, Math.PI * 2);
          context.fill();

          context.fillStyle = color.eye;
          context.beginPath();
          context.arc(cx - 4, cy - 3, 2, 0, Math.PI * 2);
          context.arc(cx + 4, cy - 3, 2, 0, Math.PI * 2);
          context.fill();

          // 口 (ギザギザ口)
          context.strokeStyle = color.eye;
          context.lineWidth = 1.5;
          context.beginPath();
          context.moveTo(cx - 5, cy + 4);
          context.lineTo(cx - 2, cy + 7);
          context.lineTo(cx, cy + 4);
          context.lineTo(cx + 2, cy + 7);
          context.lineTo(cx + 5, cy + 4);
          context.stroke();
        }
        context.restore();
      }

      function drawCapsulePart(context, x, y, colorId, isHighlight = false) {
        const color = COLOR_MAP[colorId];
        if (!color) return;
        const radius = CELL_SIZE / 2 - 3;
        const cx = x + CELL_SIZE / 2;
        const cy = y + CELL_SIZE / 2;

        context.save();
        if (isHighlight) {
          context.fillStyle = '#ffffff';
          context.beginPath();
          context.arc(cx, cy, radius + 2, 0, Math.PI * 2);
          context.fill();
        } else {
          // カプセルパーツ描画
          const grad = context.createRadialGradient(
            cx - radius * 0.3, cy - radius * 0.3, radius * 0.1,
            cx, cy, radius
          );
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.4, color.bg);
          grad.addColorStop(1, color.border);

          context.fillStyle = grad;
          context.beginPath();
          context.arc(cx, cy, radius, 0, Math.PI * 2);
          context.fill();
          context.strokeStyle = color.border;
          context.lineWidth = 2;
          context.stroke();

          // カプセルの光沢ライン
          context.strokeStyle = 'rgba(255, 255, 255, 0.6)';
          context.lineWidth = 2;
          context.beginPath();
          context.arc(cx, cy, radius * 0.6, -Math.PI * 0.7, -Math.PI * 0.2);
          context.stroke();
        }
        context.restore();
      }

      function draw(eraseCells = [], hideErase = false) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // グリッド描画
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        for (let r = 0; r <= ROWS; r++) {
          ctx.beginPath();
          ctx.moveTo(0, r * CELL_SIZE);
          ctx.lineTo(canvas.width, r * CELL_SIZE);
          ctx.stroke();
        }
        for (let c = 0; c <= COLS; c++) {
          ctx.beginPath();
          ctx.moveTo(c * CELL_SIZE, 0);
          ctx.lineTo(c * CELL_SIZE, canvas.height);
          ctx.stroke();
        }

        // フィールド
        const eraseMap = new Set(eraseCells.map(cell => `${cell.r},${cell.c}`));
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = board[r][c];
            if (cell.type !== 'empty') {
              const isErase = eraseMap.has(`${r},${c}`);
              if (isErase && hideErase) continue;
              const px = c * CELL_SIZE;
              const py = r * CELL_SIZE;

              if (cell.type === 'virus') {
                drawVirus(ctx, px, py, cell.color, isErase);
              } else if (cell.type === 'capsule') {
                drawCapsulePart(ctx, px, py, cell.color, isErase);
              }
            }
          }
        }

        // 落下中カプセル
        if (currentCapsule && !isProcessing) {
          const parts = getCapsuleParts(currentCapsule);
          for (const p of parts) {
            if (p.y >= 0) {
              drawCapsulePart(ctx, p.x * CELL_SIZE, p.y * CELL_SIZE, p.color);
            }
          }
        }
      }

      function drawNextCapsule() {
        nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
        if (!nextCapsule) return;
        // 横向きに描画
        drawCapsulePart(nextCtx, 5, 5, nextCapsule.c1);
        drawCapsulePart(nextCtx, 30, 5, nextCapsule.c2);
      }

      // --- メインループ ---
      function gameLoop(timestamp) {
        if (isGameOver) return;

        if (!isProcessing && currentCapsule) {
          if (timestamp - lastDropTime > dropInterval) {
            softDrop();
            lastDropTime = timestamp;
          }
        }

        draw();
        animationFrameId = requestAnimationFrame(gameLoop);
      }

      // --- キーボード＆タッチ操作 ---
      document.addEventListener('keydown', (e) => {
        if (isGameOver || isProcessing) return;
        switch (e.key) {
          case 'ArrowLeft':
            moveLeft();
            break;
          case 'ArrowRight':
            moveRight();
            break;
          case 'ArrowDown':
            softDrop();
            break;
          case 'Space':
            hardDrop();
            break;
          case 'ArrowUp':
          case 'x':
          case 'X':
          case 'z':
          case 'Z':
            rotate();
            break;
        }
      });

      function setupButton(btnId, actionFn, repeat = false) {
        const btn = document.getElementById(btnId);
        if (!btn) return;

        let intervalId = null;

        const start = (e) => {
          e.preventDefault();
          btn.classList.add('active');
          actionFn();
          if (repeat) {
            intervalId = setInterval(actionFn, 120);
          }
        };

        const stop = (e) => {
          if (e) e.preventDefault();
          btn.classList.remove('active');
          if (intervalId) {
            clearInterval(intervalId);
            intervalId = null;
          }
        };

        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', stop, { passive: false });
        btn.addEventListener('touchcancel', stop, { passive: false });

        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', stop);
        btn.addEventListener('mouseleave', stop);
      }

      setupButton('btnLeft', moveLeft, true);
      setupButton('btnRight', moveRight, true);
      setupButton('btnSoftDrop', softDrop, true);
      setupButton('btnHardDrop', hardDrop, false);
      setupButton('btnRotate', rotate, false);

      window.resetGame();
    })();
  </script>
</body>
</html>
