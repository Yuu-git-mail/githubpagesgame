<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, minimum-scale=1.0">
  <title>スネークゲーム - Game Hub</title>
  <link rel="stylesheet" href="../../css/common.css">
  <style>
    .score-board {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 400px;
      margin-bottom: 1.0rem;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.8rem;
      padding: 0.8rem 1.2rem;
      box-shadow: 0 2px 4px var(--shadow-color);
    }
    .score-item {
      text-align: center;
    }
    .score-label {
      font-size: 1.2rem;
      color: var(--text-muted);
    }
    .score-value {
      font-size: 2.0rem;
      font-weight: 700;
      color: var(--accent-color);
    }
    .dpad-container {
      width: 100%;
      max-width: 260px;
      margin: 1.5rem auto 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 0.8rem;
    }
    .dpad-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 2.2rem;
      border-radius: 0.8rem;
      height: 5.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      box-shadow: 0 2px 4px var(--shadow-color);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .dpad-btn:active {
      background-color: var(--accent-color);
      color: var(--accent-text);
      transform: scale(0.95);
    }
    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>

  <header id="game-header" data-title="スネークゲーム" data-back="../../index.html" data-reset></header>

  <div class="container">
    <div class="game-container">
      
      <!-- スコアボード -->
      <div class="score-board">
        <div class="score-item">
          <div class="score-label">SCORE</div>
          <div id="score" class="score-value">0</div>
        </div>
        <div class="score-item">
          <div class="score-label">HIGH SCORE</div>
          <div id="high-score" class="score-value">0</div>
        </div>
      </div>

      <!-- ゲームキャンバス -->
      <div class="game-canvas-wrapper">
        <canvas id="game-canvas" class="game-canvas" width="400" height="400"></canvas>
      </div>

      <!-- タッチ十字キー操作パネル -->
      <div class="dpad-container">
        <button id="btn-up" class="dpad-btn dpad-up" aria-label="上">▲</button>
        <button id="btn-left" class="dpad-btn dpad-left" aria-label="左">◀</button>
        <button id="btn-right" class="dpad-btn dpad-right" aria-label="右">▶</button>
        <button id="btn-down" class="dpad-btn dpad-down" aria-label="下">▼</button>
      </div>

      <!-- 操作説明カード -->
      <div class="instructions-card">
        <h2 class="h2-heading" style="margin-top:0;">🎮 操作方法</h2>
        <p class="text-m">
          ・キーボード：<strong>矢印キー (▲/▼/◀/▶)</strong> または <strong>WASD</strong><br>
          ・スマホ/タブレット：画面下の<strong>十字ボタン</strong>をタップ<br>
          ・エサ（赤丸）を食べると体が伸びてスコアアップ！<br>
          ・壁や自分の体に当たるとゲームオーバーになります。
        </p>
      </div>

    </div>
  </div>

  <footer id="game-footer"></footer>

  <script src="../../js/common.js"></script>
  <script>
    (function() {
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      const scoreElem = document.getElementById('score');
      const highScoreElem = document.getElementById('high-score');

      const GRID_COUNT = 20; // 20x20 マス
      const CELL_SIZE = canvas.width / GRID_COUNT; // 20px

      let snake = [];
      let direction = { x: 1, y: 0 };
      let nextDirection = { x: 1, y: 0 };
      let food = { x: 0, y: 0 };
      let score = 0;
      let highScore = parseInt(localStorage.getItem('snake_high_score') || '0', 10);
      let gameInterval = null;
      let isGameOver = false;
      let isGameStarted = false;

      highScoreElem.textContent = highScore;

      function initGame() {
        if (gameInterval) clearInterval(gameInterval);

        snake = [
          { x: 5, y: 10 },
          { x: 4, y: 10 },
          { x: 3, y: 10 }
        ];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        isGameOver = false;
        isGameStarted = true;
        scoreElem.textContent = score;

        spawnFood();
        draw();

        gameInterval = setInterval(gameLoop, 120);
      }

      function spawnFood() {
        let valid = false;
        while (!valid) {
          food.x = Math.floor(Math.random() * GRID_COUNT);
          food.y = Math.floor(Math.random() * GRID_COUNT);
          valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
        }
      }

      function gameLoop() {
        if (isGameOver) return;

        direction = { ...nextDirection };
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

        // 壁との衝突
        if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
          setGameOver();
          return;
        }

        // 自分の体との衝突
        if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
          setGameOver();
          return;
        }

        snake.unshift(head);

        // エサを食べた判定
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreElem.textContent = score;
          if (score > highScore) {
            highScore = score;
            highScoreElem.textContent = highScore;
            localStorage.setItem('snake_high_score', highScore.toString());
          }
          spawnFood();
        } else {
          snake.pop();
        }

        draw();
      }

      function setGameOver() {
        isGameOver = true;
        clearInterval(gameInterval);
        draw();
      }

      function draw() {
        // 背景クリア
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // グリッド線の描画 (うっすら)
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        for (let i = 0; i <= GRID_COUNT; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL_SIZE, 0);
          ctx.lineTo(i * CELL_SIZE, canvas.height);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, i * CELL_SIZE);
          ctx.lineTo(canvas.width, i * CELL_SIZE);
          ctx.stroke();
        }

        // エサの描画
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(
          food.x * CELL_SIZE + CELL_SIZE / 2,
          food.y * CELL_SIZE + CELL_SIZE / 2,
          CELL_SIZE / 2 - 2,
          0,
          Math.PI * 2
        );
        ctx.fill();

        // スネークの描画
        snake.forEach((segment, index) => {
          if (index === 0) {
            ctx.fillStyle = '#22c55e'; // 頭（鮮やかな緑）
          } else {
            ctx.fillStyle = '#4ade80'; // 体（明るい緑）
          }
          ctx.beginPath();
          ctx.roundRect(
            segment.x * CELL_SIZE + 1,
            segment.y * CELL_SIZE + 1,
            CELL_SIZE - 2,
            CELL_SIZE - 2,
            4
          );
          ctx.fill();
        });

        // スタート前 / ゲームオーバー画面の描画
        if (!isGameStarted) {
          drawOverlay('スネークゲーム', 'タップまたはキー入力でスタート');
        } else if (isGameOver) {
          drawOverlay('GAME OVER', `SCORE: ${score} - リセットで再挑戦`);
        }
      }

      function drawOverlay(title, subtitle) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 15);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px sans-serif';
        ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 25);
      }

      // 操作入力
      function changeDirection(newDir) {
        if (!isGameStarted || isGameOver) {
          initGame();
          return;
        }
        // 反対方向への転換を防止
        if (newDir.x + direction.x !== 0 || newDir.y + direction.y !== 0) {
          nextDirection = newDir;
        }
      }

      // キーボード操作
      window.addEventListener('keydown', (e) => {
        switch (e.key) {
          case 'ArrowUp':
          case 'w':
          case 'W':
            changeDirection({ x: 0, y: -1 });
            e.preventDefault();
            break;
          case 'ArrowDown':
          case 's':
          case 'S':
            changeDirection({ x: 0, y: 1 });
            e.preventDefault();
            break;
          case 'ArrowLeft':
          case 'a':
          case 'A':
            changeDirection({ x: -1, y: 0 });
            e.preventDefault();
            break;
          case 'ArrowRight':
          case 'd':
          case 'D':
            changeDirection({ x: 1, y: 0 });
            e.preventDefault();
            break;
        }
      });

      // ボタンタッチ操作
      const bindBtn = (id, dir) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        const handler = (e) => {
          e.preventDefault();
          changeDirection(dir);
        };
        btn.addEventListener('pointerdown', handler);
      };

      bindBtn('btn-up', { x: 0, y: -1 });
      bindBtn('btn-down', { x: 0, y: 1 });
      bindBtn('btn-left', { x: -1, y: 0 });
      bindBtn('btn-right', { x: 1, y: 0 });

      canvas.addEventListener('pointerdown', () => {
        if (!isGameStarted || isGameOver) {
          initGame();
        }
      });

      // 共通リセット関数
      window.resetGame = function() {
        initGame();
      };

      // 初期描画
      draw();
    })();
  </script>
</body>
</html>
