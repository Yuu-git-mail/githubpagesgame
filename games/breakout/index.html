<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, minimum-scale=1.0">
  <title>ブロック崩し - Game Hub</title>
  <link rel="stylesheet" href="../../css/common.css">
  <style>
    .game-status-board {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 400px;
      margin-bottom: 1.0rem;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.8rem;
      padding: 0.8rem 1.2rem;
      box-shadow: 0 2px 4px var(--shadow-color);
    }
    .status-item {
      text-align: center;
    }
    .status-label {
      font-size: 1.2rem;
      color: var(--text-muted);
    }
    .status-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-color);
    }
    .paddle-controls {
      width: 100%;
      max-width: 400px;
      margin: 1.5rem auto 0 auto;
      display: flex;
      gap: 1.2rem;
    }
    .paddle-btn {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 2.0rem;
      font-weight: bold;
      border-radius: 0.8rem;
      height: 5.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      box-shadow: 0 2px 4px var(--shadow-color);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .paddle-btn:active {
      background-color: var(--accent-color);
      color: var(--accent-text);
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <header id="game-header" data-title="ブロック崩し" data-back="../../index.html" data-reset></header>

  <div class="container">
    <div class="game-container">
      
      <!-- ステータスボード -->
      <div class="game-status-board">
        <div class="status-item">
          <div class="status-label">SCORE</div>
          <div id="score" class="status-value">0</div>
        </div>
        <div class="status-item">
          <div class="status-label">LIVES</div>
          <div id="lives" class="status-value">❤️❤️❤️</div>
        </div>
        <div class="status-item">
          <div class="status-label">HIGH SCORE</div>
          <div id="high-score" class="status-value">0</div>
        </div>
      </div>

      <!-- ゲームキャンバス -->
      <div class="game-canvas-wrapper">
        <canvas id="game-canvas" class="game-canvas" width="400" height="450"></canvas>
      </div>

      <!-- パドル操作ボタン -->
      <div class="paddle-controls">
        <button id="btn-left" class="paddle-btn" aria-label="左移動">◀ 左</button>
        <button id="btn-right" class="paddle-btn" aria-label="右移動">右 ▶</button>
      </div>

      <!-- 操作説明カード -->
      <div class="instructions-card">
        <h2 class="h2-heading" style="margin-top:0;">🎮 操作方法</h2>
        <p class="text-m">
          ・キーボード：<strong>左右矢印キー (◀/▶)</strong> または <strong>A / D</strong><br>
          ・スマホ/タブレット：画面下の<strong>「◀ 左」「右 ▶」ボタン</strong>を押し続けるか、<strong>キャンバス上をスライド</strong><br>
          ・ボールをパドルで打ち返し、すべてのブロックを破壊するとクリア！
        </p>
      </div>

    </div>
  </div>

  <footer id="game-footer"></footer>

  <script src="../../js/common.js"></script>
  <script>
    (function() {
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      const scoreElem = document.getElementById('score');
      const livesElem = document.getElementById('lives');
      const highScoreElem = document.getElementById('high-score');

      // 定数設定
      const PADDLE_WIDTH = 80;
      const PADDLE_HEIGHT = 12;
      const BALL_RADIUS = 7;
      const BRICK_ROWS = 5;
      const BRICK_COLS = 8;
      const BRICK_PADDING = 6;
      const BRICK_OFFSET_TOP = 40;
      const BRICK_OFFSET_LEFT = 10;
      const BRICK_WIDTH = (canvas.width - (BRICK_OFFSET_LEFT * 2) - (BRICK_PADDING * (BRICK_COLS - 1))) / BRICK_COLS;
      const BRICK_HEIGHT = 16;
      const BRICK_COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];

      // ゲーム状態
      let paddleX = (canvas.width - PADDLE_WIDTH) / 2;
      let ballX = canvas.width / 2;
      let ballY = canvas.height - 40;
      let ballSpeed = 4.5;
      let ballDx = ballSpeed * (Math.random() > 0.5 ? 1 : -1);
      let ballDy = -ballSpeed;
      let score = 0;
      let lives = 3;
      let highScore = parseInt(localStorage.getItem('breakout_high_score') || '0', 10);
      let bricks = [];
      let rightPressed = false;
      let leftPressed = false;
      let isGameStarted = false;
      let isGameOver = false;
      let isClear = false;
      let animationFrameId = null;

      highScoreElem.textContent = highScore;

      function initBricks() {
        bricks = [];
        for (let r = 0; r < BRICK_ROWS; r++) {
          bricks[r] = [];
          for (let c = 0; c < BRICK_COLS; c++) {
            bricks[r][c] = { x: 0, y: 0, status: 1 };
          }
        }
      }

      function initGame() {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);

        paddleX = (canvas.width - PADDLE_WIDTH) / 2;
        resetBall();
        score = 0;
        lives = 3;
        isGameStarted = true;
        isGameOver = false;
        isClear = false;
        
        scoreElem.textContent = score;
        updateLivesDisplay();
        initBricks();

        gameLoop();
      }

      function resetBall() {
        ballX = canvas.width / 2;
        ballY = canvas.height - 40;
        const angle = (Math.random() * 0.6 - 0.3); // ややランダムな角度
        ballDx = ballSpeed * Math.sin(angle);
        ballDy = -ballSpeed * Math.cos(angle);
      }

      function updateLivesDisplay() {
        livesElem.textContent = '❤️'.repeat(Math.max(0, lives));
      }

      function collisionDetection() {
        let activeBricks = 0;
        for (let r = 0; r < BRICK_ROWS; r++) {
          for (let c = 0; c < BRICK_COLS; c++) {
            const b = bricks[r][c];
            if (b.status === 1) {
              activeBricks++;
              if (
                ballX + BALL_RADIUS > b.x &&
                ballX - BALL_RADIUS < b.x + BRICK_WIDTH &&
                ballY + BALL_RADIUS > b.y &&
                ballY - BALL_RADIUS < b.y + BRICK_HEIGHT
              ) {
                ballDy = -ballDy;
                b.status = 0;
                score += (BRICK_ROWS - r) * 10;
                scoreElem.textContent = score;

                if (score > highScore) {
                  highScore = score;
                  highScoreElem.textContent = highScore;
                  localStorage.setItem('breakout_high_score', highScore.toString());
                }

                if (activeBricks - 1 === 0) {
                  isClear = true;
                }
              }
            }
          }
        }
      }

      function update() {
        if (!isGameStarted || isGameOver || isClear) return;

        // パドル移動
        const paddleSpeed = 7;
        if (rightPressed && paddleX < canvas.width - PADDLE_WIDTH) {
          paddleX += paddleSpeed;
        } else if (leftPressed && paddleX > 0) {
          paddleX -= paddleSpeed;
        }

        // ボール壁反射 (左右)
        if (ballX + ballDx > canvas.width - BALL_RADIUS || ballX + ballDx < BALL_RADIUS) {
          ballDx = -ballDx;
        }

        // ボール壁反射 (上)
        if (ballY + ballDy < BALL_RADIUS) {
          ballDy = -ballDy;
        } else if (ballY + ballDy > canvas.height - PADDLE_HEIGHT - 10 - BALL_RADIUS) {
          // パドル衝突判定
          if (
            ballX + BALL_RADIUS >= paddleX &&
            ballX - BALL_RADIUS <= paddleX + PADDLE_WIDTH &&
            ballY <= canvas.height - 10
          ) {
            // 打角変更（中心からの距離に応じる）
            const hitPos = (ballX - (paddleX + PADDLE_WIDTH / 2)) / (PADDLE_WIDTH / 2);
            const maxAngle = Math.PI / 3; // 最大60度
            const angle = hitPos * maxAngle;

            ballDx = ballSpeed * Math.sin(angle);
            ballDy = -ballSpeed * Math.cos(angle);
          } else if (ballY + ballDy > canvas.height - BALL_RADIUS) {
            // 落下・ミス
            lives--;
            updateLivesDisplay();

            if (lives <= 0) {
              isGameOver = true;
            } else {
              resetBall();
            }
          }
        }

        ballX += ballDx;
        ballY += ballDy;

        collisionDetection();
      }

      function draw() {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ブロック描画
        for (let r = 0; r < BRICK_ROWS; r++) {
          for (let c = 0; c < BRICK_COLS; c++) {
            if (bricks[r][c].status === 1) {
              const brickX = c * (BRICK_WIDTH + BRICK_PADDING) + BRICK_OFFSET_LEFT;
              const brickY = r * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_OFFSET_TOP;
              bricks[r][c].x = brickX;
              bricks[r][c].y = brickY;

              ctx.fillStyle = BRICK_COLORS[r % BRICK_COLORS.length];
              ctx.beginPath();
              ctx.roundRect(brickX, brickY, BRICK_WIDTH, BRICK_HEIGHT, 3);
              ctx.fill();
            }
          }
        }

        // パドル描画
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.roundRect(paddleX, canvas.height - PADDLE_HEIGHT - 10, PADDLE_WIDTH, PADDLE_HEIGHT, 6);
        ctx.fill();

        // ボール描画
        if (isGameStarted && !isGameOver && !isClear) {
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
          ctx.fill();
        }

        // オーバーレイ描画
        if (!isGameStarted) {
          drawOverlay('ブロック崩し', 'タップまたは操作キーでスタート');
        } else if (isGameOver) {
          drawOverlay('GAME OVER', `FINAL SCORE: ${score}`);
        } else if (isClear) {
          drawOverlay('STAGE CLEAR! 🎉', `EXCELLENT! SCORE: ${score}`);
        }
      }

      function drawOverlay(title, subtitle) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 15);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px sans-serif';
        ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 25);
      }

      function gameLoop() {
        update();
        draw();
        if (isGameStarted && !isGameOver && !isClear) {
          animationFrameId = requestAnimationFrame(gameLoop);
        }
      }

      // イベント制御
      function handleStart() {
        if (!isGameStarted || isGameOver || isClear) {
          initGame();
        }
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          rightPressed = true;
          handleStart();
          e.preventDefault();
        } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          leftPressed = true;
          handleStart();
          e.preventDefault();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
          rightPressed = false;
        } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
          leftPressed = false;
        }
      });

      // タッチ・ボタン操作
      const bindBtn = (id, setPress) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        
        const start = (e) => {
          e.preventDefault();
          setPress(true);
          handleStart();
        };
        const end = (e) => {
          e.preventDefault();
          setPress(false);
        };

        btn.addEventListener('pointerdown', start);
        btn.addEventListener('pointerup', end);
        btn.addEventListener('pointerleave', end);
        btn.addEventListener('pointercancel', end);
      };

      bindBtn('btn-left', (val) => { leftPressed = val; });
      bindBtn('btn-right', (val) => { rightPressed = val; });

      // キャンバスタッチ/マウスポインタで直接パドル操作
      canvas.addEventListener('pointermove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const relativeX = e.clientX - rect.left;
        const scaleX = canvas.width / rect.width;
        const targetX = (relativeX * scaleX) - (PADDLE_WIDTH / 2);
        
        if (targetX >= 0 && targetX <= canvas.width - PADDLE_WIDTH) {
          paddleX = targetX;
        }
      });

      canvas.addEventListener('pointerdown', () => {
        handleStart();
      });

      // 共通リセット関数
      window.resetGame = function() {
        initGame();
      };

      // 初期状態描画
      initBricks();
      draw();
    })();
  </script>
</body>
</html>
