<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, minimum-scale=1.0">
  <title>フロッガー - Frogger Arcade Game</title>
  <link rel="stylesheet" href="../../css/common.css">
  <style>
    /* フロッガー専用スタイルの拡張 */
    .game-stats {
      width: 100%;
      max-width: 416px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      font-weight: bold;
      background-color: var(--card-bg);
      padding: 0.6rem 1.0rem;
      border-radius: 0.6rem;
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 4px var(--shadow-color);
    }
    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-label {
      font-size: 1.0rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
    .stat-value {
      font-size: 1.5rem;
      color: var(--accent-color);
      font-family: monospace, monospace;
    }
    .dpad-container {
      width: 100%;
      max-width: 240px;
      margin: 1.2rem auto 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 52px);
      gap: 0.6rem;
    }
    .dpad-btn {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      color: var(--text-main);
      font-size: 2.2rem;
      border-radius: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      box-shadow: 0 3px 6px var(--shadow-color);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.1s, transform 0.1s;
    }
    .dpad-btn:active, .dpad-btn.active {
      background-color: var(--accent-color);
      color: var(--accent-text);
      transform: scale(0.93);
    }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }
    #btn-right { grid-column: 3; grid-row: 2; }

    .game-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
      width: 100%;
      max-width: 416px;
    }
  </style>
</head>
<body>
  <!-- 共通ヘッダー -->
  <header id="game-header" data-title="フロッガー" data-back="../../index.html" data-reset></header>

  <main class="container">
    <div class="game-container">
      <!-- ステータス表示 -->
      <div class="game-stats">
        <div class="stat-box">
          <span class="stat-label">SCORE</span>
          <span id="scoreVal" class="stat-value">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">HI-SCORE</span>
          <span id="hiScoreVal" class="stat-value">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">LEVEL</span>
          <span id="levelVal" class="stat-value">1</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">LIVES</span>
          <span id="livesVal" class="stat-value">🐸🐸🐸</span>
        </div>
      </div>

      <!-- ゲームキャンバス -->
      <div class="game-canvas-wrapper">
        <canvas id="gameCanvas" width="416" height="448" class="game-canvas"></canvas>
      </div>

      <!-- 十字キー操作パネル（スマホ・タッチ対応） -->
      <div class="dpad-container">
        <button class="dpad-btn" id="btn-up" aria-label="上">▲</button>
        <button class="dpad-btn" id="btn-left" aria-label="左">◀</button>
        <button class="dpad-btn" id="btn-down" aria-label="下">▼</button>
        <button class="dpad-btn" id="btn-right" aria-label="右">▶</button>
      </div>

      <!-- アクションボタン -->
      <div class="game-actions">
        <button id="btn-start" class="btn" style="flex: 1;">ゲームスタート</button>
        <button id="btn-sound" class="btn btn-secondary" style="width: 54px;" aria-label="サウンド切り替え">🔊</button>
      </div>

      <!-- 操作説明 -->
      <div class="instructions-card">
        <h2>🎮 遊び方</h2>
        <p class="text-m">
          カエルを操作して、危険な<strong>道路</strong>と流れる丸太やカメのある<strong>川</strong>を渡り、画面上部の<strong>5つのゴール穴</strong>を目指そう！
        </p>
        <ul class="text-m" style="padding-left: 1.5rem; margin-top: 0.5rem;">
          <li><strong>操作</strong>: 画面上の十字キー / キーボード矢印キー (WASD)</li>
          <li><strong>注意</strong>: 車に轢かれる、川に落ちる、画面外に押し出される、時間切れでミス</li>
          <li><strong>潜水カメ</strong>: 定期的に水中に潜るカメには乗れません</li>
          <li><strong>目標</strong>: 5つの穴すべてにカエルを入れるとステージクリア！</li>
        </ul>
      </div>
    </div>
  </main>

  <!-- 共通フッター -->
  <footer id="game-footer"></footer>

  <!-- 共通JS -->
  <script src="../../js/common.js"></script>

  <!-- ゲームメインスクリプト -->
  <script>
    (() => {
      // ----------------------------------------------------
      // 定数設定
      // ----------------------------------------------------
      const GRID_SIZE = 32;
      const COLS = 13; // 416px
      const ROWS = 14; // 448px
      const TIME_LIMIT = 30; // 1回あたりの秒数

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      // DOM要素
      const scoreVal = document.getElementById('scoreVal');
      const hiScoreVal = document.getElementById('hiScoreVal');
      const levelVal = document.getElementById('levelVal');
      const livesVal = document.getElementById('livesVal');
      const btnStart = document.getElementById('btn-start');
      const btnSound = document.getElementById('btn-sound');

      // サウンドWeb Audio Synthesizer
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSound(type) {
        if (!soundEnabled || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          if (type === 'jump') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(440, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
          } else if (type === 'home') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
            osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
          } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.25);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
          } else if (type === 'clear') {
            osc.type = 'square';
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
              osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            });
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
            osc.start(now);
            osc.stop(now + 0.45);
          }
        } catch (e) {
          // Audio errors swallowed silently
        }
      }

      // ----------------------------------------------------
      // ゲーム状態変数
      // ----------------------------------------------------
      let gameState = 'START'; // 'START', 'PLAYING', 'DYING', 'CLEAR', 'GAMEOVER'
      let score = 0;
      let hiScore = localStorage.getItem('frogger_hi_score') ? parseInt(localStorage.getItem('frogger_hi_score')) : 0;
      let level = 1;
      let lives = 3;
      let timeRemaining = TIME_LIMIT;
      let lastTime = 0;
      let deathTimer = 0;
      let clearTimer = 0;
      let globalAnimTime = 0;

      // ゴール穴のデータ (5箇所)
      const homes = [
        { x: 16, filled: false },
        { x: 104, filled: false },
        { x: 192, filled: false },
        { x: 280, filled: false },
        { x: 368, filled: false }
      ];

      // カエル
      const frog = {
        gridX: 6,
        gridY: 12,
        x: 6 * GRID_SIZE,
        y: 12 * GRID_SIZE,
        width: 24,
        height: 24,
        dir: 'UP',
        highestGridY: 12
      };

      // レーンのオブジェクト（車・丸太・カメ）
      let lanes = [];

      function initLanes() {
        const speedMult = 1 + (level - 1) * 0.15;
        lanes = [
          // Row 1: カメ (左移動)
          { row: 1, type: 'turtle', speed: -1.2 * speedMult, items: createTurtleItems(3, 3) },
          // Row 2: 短い丸太 (右移動)
          { row: 2, type: 'log', speed: 1.5 * speedMult, items: createLogItems(3, 2 * GRID_SIZE) },
          // Row 3: 大丸太 (右移動)
          { row: 3, type: 'log', speed: 2.2 * speedMult, items: createLogItems(2, 4 * GRID_SIZE) },
          // Row 4: 潜水カメ (左移動)
          { row: 4, type: 'diving_turtle', speed: -1.4 * speedMult, items: createTurtleItems(3, 2) },
          // Row 5: 中丸太 (右移動)
          { row: 5, type: 'log', speed: 1.1 * speedMult, items: createLogItems(3, 3 * GRID_SIZE) },

          // Row 6: セーフゾーン (中間)

          // Row 7: 大型トラック (右移動)
          { row: 7, type: 'truck_purple', speed: 1.0 * speedMult, items: createVehicleItems(2, 3 * GRID_SIZE) },
          // Row 8: 乗用車 (左移動)
          { row: 8, type: 'car_green', speed: -1.8 * speedMult, items: createVehicleItems(3, 1.2 * GRID_SIZE) },
          // Row 9: レースカー (右移動)
          { row: 9, type: 'racecar_red', speed: 2.8 * speedMult, items: createVehicleItems(2, 1.2 * GRID_SIZE) },
          // Row 10: トラック (左移動)
          { row: 10, type: 'truck_blue', speed: -1.3 * speedMult, items: createVehicleItems(2, 2.5 * GRID_SIZE) },
          // Row 11: 黄色い車 (右移動)
          { row: 11, type: 'car_yellow', speed: 1.5 * speedMult, items: createVehicleItems(3, 1.2 * GRID_SIZE) }
        ];
      }

      function createLogItems(count, length) {
        const items = [];
        const gap = (COLS * GRID_SIZE) / count;
        for (let i = 0; i < count; i++) {
          items.push({
            x: i * gap,
            width: length
          });
        }
        return items;
      }

      function createTurtleItems(count, numTurtles) {
        const items = [];
        const gap = (COLS * GRID_SIZE) / count;
        const width = numTurtles * 28;
        for (let i = 0; i < count; i++) {
          items.push({
            x: i * gap,
            width: width,
            numTurtles: numTurtles
          });
        }
        return items;
      }

      function createVehicleItems(count, length) {
        const items = [];
        const gap = (COLS * GRID_SIZE) / count;
        for (let i = 0; i < count; i++) {
          items.push({
            x: i * gap,
            width: length
          });
        }
        return items;
      }

      // ----------------------------------------------------
      // ゲーム制御 & 初期化
      // ----------------------------------------------------
      function resetFrog() {
        frog.gridX = 6;
        frog.gridY = 12;
        frog.x = frog.gridX * GRID_SIZE + (GRID_SIZE - frog.width) / 2;
        frog.y = frog.gridY * GRID_SIZE + (GRID_SIZE - frog.height) / 2;
        frog.dir = 'UP';
        frog.highestGridY = 12;
        timeRemaining = TIME_LIMIT;
      }

      window.resetGame = function() {
        score = 0;
        level = 1;
        lives = 3;
        homes.forEach(h => h.filled = false);
        resetFrog();
        initLanes();
        gameState = 'START';
        updateUI();
        btnStart.textContent = 'ゲームスタート';
      };

      function updateUI() {
        scoreVal.textContent = score;
        hiScoreVal.textContent = hiScore;
        levelVal.textContent = level;
        let hearts = '';
        for (let i = 0; i < lives; i++) hearts += '🐸';
        livesVal.textContent = hearts || '💀';
      }

      function addScore(pts) {
        score += pts;
        if (score > hiScore) {
          hiScore = score;
          localStorage.setItem('frogger_hi_score', hiScore);
        }
        updateUI();
      }

      function moveFrog(dir) {
        if (gameState !== 'PLAYING') return;

        initAudio();
        frog.dir = dir;

        let nextX = frog.gridX;
        let nextY = frog.gridY;

        if (dir === 'UP') nextY--;
        if (dir === 'DOWN') nextY++;
        if (dir === 'LEFT') nextX--;
        if (dir === 'RIGHT') nextX++;

        // 画面外への移動防止（下・左右）
        if (nextX < 0 || nextX >= COLS || nextY > 12 || nextY < 0) {
          return;
        }

        frog.gridX = nextX;
        frog.gridY = nextY;
        frog.x = frog.gridX * GRID_SIZE + (GRID_SIZE - frog.width) / 2;
        frog.y = frog.gridY * GRID_SIZE + (GRID_SIZE - frog.height) / 2;

        playSound('jump');

        // 前進スコア
        if (frog.gridY < frog.highestGridY) {
          addScore(10);
          frog.highestGridY = frog.gridY;
        }

        // ゴール到達判定 (Row 0)
        if (frog.gridY === 0) {
          checkHomeArrival();
        }
      }

      function checkHomeArrival() {
        const frogCenterX = frog.x + frog.width / 2;
        let hitHomeIndex = -1;

        for (let i = 0; i < homes.length; i++) {
          const home = homes[i];
          // ゴール穴の判定（幅32px）
          if (Math.abs(frogCenterX - (home.x + 16)) < 18) {
            if (!home.filled) {
              hitHomeIndex = i;
            }
            break;
          }
        }

        if (hitHomeIndex !== -1) {
          // ゴール成功！
          homes[hitHomeIndex].filled = true;
          const timeBonus = Math.floor(timeRemaining) * 10;
          addScore(50 + timeBonus);
          playSound('home');

          // 全ゴールチェック
          const allFilled = homes.every(h => h.filled);
          if (allFilled) {
            gameState = 'CLEAR';
            clearTimer = 1.5;
            addScore(1000);
            playSound('clear');
          } else {
            resetFrog();
          }
        } else {
          // ゴール以外の草に突っ込んだ場合ミス
          killFrog('草むらに激突！');
        }
      }

      function killFrog(reason) {
        if (gameState === 'DYING') return;
        gameState = 'DYING';
        deathTimer = 1.0;
        playSound('die');
        lives--;
        updateUI();
      }

      // ----------------------------------------------------
      // 更新ロジック
      // ----------------------------------------------------
      function update(dt) {
        globalAnimTime += dt;

        if (gameState === 'PLAYING') {
          // タイマーカウントダウン
          timeRemaining -= dt;
          if (timeRemaining <= 0) {
            timeRemaining = 0;
            killFrog('タイムオーバー！');
            return;
          }

          // レーンオブジェクト移動
          lanes.forEach(lane => {
            lane.items.forEach(item => {
              item.x += lane.speed * (60 * dt);
              // 画面外ループ
              const totalW = COLS * GRID_SIZE;
              if (lane.speed > 0 && item.x > totalW) {
                item.x -= totalW + item.width;
              } else if (lane.speed < 0 && item.x + item.width < 0) {
                item.x += totalW + item.width;
              }
            });
          });

          // 潜水カメの沈み判定 (周期 4秒: 2.8秒浮上, 1.2秒潜水)
          const turtleSubmerged = (globalAnimTime % 4.0) > 2.8;

          // 物理・判定チェック
          const frogRow = frog.gridY;

          // 道路ゾーン (Row 7 ~ 11)
          if (frogRow >= 7 && frogRow <= 11) {
            const currentLane = lanes.find(l => l.row === frogRow);
            if (currentLane) {
              const frogBox = { x: frog.x, y: frog.y, w: frog.width, h: frog.height };
              for (let item of currentLane.items) {
                const vehicleBox = {
                  x: item.x,
                  y: currentLane.row * GRID_SIZE + 2,
                  w: item.width,
                  h: GRID_SIZE - 4
                };
                if (isColliding(frogBox, vehicleBox)) {
                  killFrog('車に激突！');
                  return;
                }
              }
            }
          }

          // 川ゾーン (Row 1 ~ 5)
          if (frogRow >= 1 && frogRow <= 5) {
            const currentLane = lanes.find(l => l.row === frogRow);
            let onSupport = false;
            let supportSpeed = 0;

            if (currentLane) {
              const frogCenterX = frog.x + frog.width / 2;

              for (let item of currentLane.items) {
                // オブジェクトの範囲判定
                if (frogCenterX >= item.x && frogCenterX <= item.x + item.width) {
                  if (currentLane.type === 'diving_turtle' && turtleSubmerged) {
                    // 潜水中で沈んでいる
                    onSupport = false;
                  } else {
                    onSupport = true;
                    supportSpeed = currentLane.speed;
                  }
                  break;
                }
              }
            }

            if (onSupport) {
              // 丸太/カメの上で移動
              frog.x += supportSpeed * (60 * dt);
              frog.gridX = Math.round(frog.x / GRID_SIZE);

              // 画面両端に押し出されたら死亡
              if (frog.x < 0 || frog.x + frog.width > COLS * GRID_SIZE) {
                killFrog('流された！');
                return;
              }
            } else {
              // 水に落水！
              killFrog('水没！');
              return;
            }
          }
        } else if (gameState === 'DYING') {
          deathTimer -= dt;
          if (deathTimer <= 0) {
            if (lives > 0) {
              resetFrog();
              gameState = 'PLAYING';
            } else {
              gameState = 'GAMEOVER';
              btnStart.textContent = 'もう一度プレイ';
            }
          }
        } else if (gameState === 'CLEAR') {
          clearTimer -= dt;
          if (clearTimer <= 0) {
            level++;
            homes.forEach(h => h.filled = false);
            initLanes();
            resetFrog();
            updateUI();
            gameState = 'PLAYING';
          }
        }
      }

      function isColliding(rect1, rect2) {
        return rect1.x < rect2.x + rect2.w &&
               rect1.x + rect1.w > rect2.x &&
               rect1.y < rect2.y + rect2.h &&
               rect1.y + rect1.h > rect2.y;
      }

      // ----------------------------------------------------
      // 描画機能 (Canvas 2D)
      // ----------------------------------------------------
      function render() {
        // 背景消去
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 1. 背景エリア描画
        // Row 0: ゴールゾーン (深緑)
        ctx.fillStyle = '#1b5e20';
        ctx.fillRect(0, 0, canvas.width, GRID_SIZE);

        // 川ゾーン (Row 1 ~ 5)
        ctx.fillStyle = '#0d47a1';
        ctx.fillRect(0, 1 * GRID_SIZE, canvas.width, 5 * GRID_SIZE);

        // 川の水波エフェクト
        ctx.strokeStyle = '#1976d2';
        ctx.lineWidth = 2;
        const waveOffset = (globalAnimTime * 20) % 32;
        for (let r = 1; r <= 5; r++) {
          ctx.beginPath();
          for (let x = -32; x < canvas.width + 32; x += 16) {
            const y = r * GRID_SIZE + 16 + Math.sin((x + waveOffset) * 0.1) * 3;
            if (x === -32) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }

        // Row 6: 中央セーフゾーン (緑)
        ctx.fillStyle = '#2e7d32';
        ctx.fillRect(0, 6 * GRID_SIZE, canvas.width, GRID_SIZE);

        // 道路ゾーン (Row 7 ~ 11)
        ctx.fillStyle = '#212121';
        ctx.fillRect(0, 7 * GRID_SIZE, canvas.width, 5 * GRID_SIZE);

        // 道路白破線
        ctx.strokeStyle = '#757575';
        ctx.setLineDash([12, 12]);
        ctx.lineWidth = 2;
        for (let r = 8; r <= 11; r++) {
          ctx.beginPath();
          ctx.moveTo(0, r * GRID_SIZE);
          ctx.lineTo(canvas.width, r * GRID_SIZE);
          ctx.stroke();
        }
        ctx.setLineDash([]); // リセット

        // Row 12: スタートセーフゾーン (緑)
        ctx.fillStyle = '#2e7d32';
        ctx.fillRect(0, 12 * GRID_SIZE, canvas.width, GRID_SIZE);

        // Row 13: タイマー & ステータスエリア (黒)
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 13 * GRID_SIZE, canvas.width, GRID_SIZE);

        // 2. ゴール穴 (Home) 描画
        homes.forEach(home => {
          // 穴の背景
          ctx.fillStyle = '#0d47a1'; // 水の背景
          ctx.fillRect(home.x, 2, 32, 28);
          ctx.strokeStyle = '#4caf50';
          ctx.lineWidth = 3;
          ctx.strokeRect(home.x, 2, 32, 28);

          if (home.filled) {
            // ゴール完了カエル描画
            drawFrogIcon(home.x + 4, 4, 24, 24, 'DOWN');
          }
        });

        // 3. レーンオブジェクト描画
        const turtleSubmerged = (globalAnimTime % 4.0) > 2.8;

        lanes.forEach(lane => {
          const y = lane.row * GRID_SIZE;
          lane.items.forEach(item => {
            if (lane.type === 'log') {
              drawLog(item.x, y + 2, item.width, GRID_SIZE - 4);
            } else if (lane.type === 'turtle' || lane.type === 'diving_turtle') {
              const isDiving = lane.type === 'diving_turtle';
              if (!isDiving || !turtleSubmerged) {
                drawTurtles(item.x, y + 2, item.numTurtles, isDiving);
              } else {
                // 潜水中水しぶき
                drawSplash(item.x, y + 2, item.numTurtles);
              }
            } else {
              // 自動車・トラック
              drawVehicle(item.x, y + 3, item.width, GRID_SIZE - 6, lane.type);
            }
          });
        });

        // 4. カエル描画
        if (gameState === 'PLAYING' || (gameState === 'DYING' && Math.floor(globalAnimTime * 10) % 2 === 0)) {
          drawFrogIcon(frog.x, frog.y, frog.width, frog.height, frog.dir);
        } else if (gameState === 'DYING') {
          // 死亡エフェクト (水しぶき / 爆発)
          drawDeathEffect(frog.x, frog.y);
        }

        // 5. タイマーゲージ (Row 13)
        const timerRatio = Math.max(0, timeRemaining / TIME_LIMIT);
        ctx.fillStyle = '#333';
        ctx.fillRect(60, 13 * GRID_SIZE + 10, 300, 12);

        ctx.fillStyle = timerRatio > 0.3 ? '#4caf50' : '#f44336';
        ctx.fillRect(60, 13 * GRID_SIZE + 10, 300 * timerRatio, 12);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px monospace';
        ctx.fillText('TIME', 15, 13 * GRID_SIZE + 20);

        // 6. オーバーレイメッセージ
        if (gameState === 'START') {
          drawOverlay('FROGGER', 'ボタンか矢印キーでスタート');
        } else if (gameState === 'GAMEOVER') {
          drawOverlay('GAME OVER', 'ボタンを押してリトライ');
        } else if (gameState === 'CLEAR') {
          drawOverlay('STAGE CLEAR!', '次のステージへ進みます');
        }
      }

      // --- 描画ヘルパー関数 ---
      function drawFrogIcon(x, y, w, h, dir) {
        ctx.save();
        ctx.translate(x + w / 2, y + h / 2);

        if (dir === 'DOWN') ctx.rotate(Math.PI);
        if (dir === 'LEFT') ctx.rotate(-Math.PI / 2);
        if (dir === 'RIGHT') ctx.rotate(Math.PI / 2);

        // 体 (黄緑)
        ctx.fillStyle = '#76ff03';
        ctx.beginPath();
        ctx.ellipse(0, 0, w / 2, h / 2.3, 0, 0, Math.PI * 2);
        ctx.fill();

        // 目
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-w / 3, -h / 3, 4, 0, Math.PI * 2);
        ctx.arc(w / 3, -h / 3, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-w / 3, -h / 3 - 1, 2, 0, Math.PI * 2);
        ctx.arc(w / 3, -h / 3 - 1, 2, 0, Math.PI * 2);
        ctx.fill();

        // 足
        ctx.strokeStyle = '#64dd17';
        ctx.lineWidth = 3;
        ctx.beginPath();
        // 前足
        ctx.moveTo(-w / 3, -h / 4); ctx.lineTo(-w / 1.8, -h / 2);
        ctx.moveTo(w / 3, -h / 4);  ctx.lineTo(w / 1.8, -h / 2);
        // 後足
        ctx.moveTo(-w / 3, h / 4);  ctx.lineTo(-w / 1.8, h / 1.8);
        ctx.moveTo(w / 3, h / 4);   ctx.lineTo(w / 1.8, h / 1.8);
        ctx.stroke();

        ctx.restore();
      }

      function drawLog(x, y, w, h) {
        // 木の丸太
        ctx.fillStyle = '#795548';
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 6);
        ctx.fill();

        ctx.fillStyle = '#5d4037';
        ctx.fillRect(x + 10, y + 4, w - 20, 3);
        ctx.fillRect(x + 20, y + 14, w - 40, 3);
      }

      function drawTurtles(x, y, count, isDivingType) {
        for (let i = 0; i < count; i++) {
          const tx = x + i * 28;
          ctx.fillStyle = isDivingType ? '#e53935' : '#43a047'; // 潜水カメは赤、通常は緑
          ctx.beginPath();
          ctx.arc(tx + 12, y + 14, 11, 0, Math.PI * 2);
          ctx.fill();

          // 甲羅模様
          ctx.fillStyle = '#1b5e20';
          ctx.beginPath();
          ctx.arc(tx + 12, y + 14, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawSplash(x, y, count) {
        ctx.fillStyle = '#64b5f6';
        for (let i = 0; i < count; i++) {
          const tx = x + i * 28;
          ctx.beginPath();
          ctx.arc(tx + 12, y + 14, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawVehicle(x, y, w, h, type) {
        let color = '#ffeb3b';
        if (type === 'car_green') color = '#00e676';
        if (type === 'racecar_red') color = '#ff1744';
        if (type === 'truck_blue') color = '#29b6f6';
        if (type === 'truck_purple') color = '#ab47bc';

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 4);
        ctx.fill();

        // 窓・ヘッドライト
        ctx.fillStyle = '#fff';
        ctx.fillRect(x + 4, y + 4, w - 8, 4);
      }

      function drawDeathEffect(x, y) {
        ctx.fillStyle = '#ff1744';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText('💥', x, y + 20);
      }

      function drawOverlay(title, subtitle) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(20, canvas.height / 2 - 60, canvas.width - 40, 120);

        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 3;
        ctx.strokeRect(20, canvas.height / 2 - 60, canvas.width - 40, 120);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);

        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 30);
        ctx.textAlign = 'left'; // リセット
      }

      // ----------------------------------------------------
      // イベント処理 & メインループ
      // ----------------------------------------------------
      function handleStart() {
        initAudio();
        if (gameState === 'START' || gameState === 'GAMEOVER') {
          if (gameState === 'GAMEOVER') {
            resetGame();
          }
          gameState = 'PLAYING';
          btnStart.textContent = '一時停止 / 再開';
        } else if (gameState === 'PLAYING') {
          gameState = 'PAUSED';
          btnStart.textContent = '再開';
        } else if (gameState === 'PAUSED') {
          gameState = 'PLAYING';
          btnStart.textContent = '一時停止';
        }
      }

      // キーボード入力
      window.addEventListener('keydown', e => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'Space'].includes(e.code)) {
          e.preventDefault();
        }

        if (e.code === 'Space') {
          handleStart();
          return;
        }

        if (gameState !== 'PLAYING') {
          if (e.code === 'ArrowUp' || e.code === 'KeyW') handleStart();
          return;
        }

        if (e.code === 'ArrowUp' || e.code === 'KeyW') moveFrog('UP');
        if (e.code === 'ArrowDown' || e.code === 'KeyS') moveFrog('DOWN');
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveFrog('LEFT');
        if (e.code === 'ArrowRight' || e.code === 'KeyD') moveFrog('RIGHT');
      });

      // スマホ・タッチ＆ボタン入力
      function bindBtn(id, dir) {
        const btn = document.getElementById(id);
        if (!btn) return;

        const trigger = (e) => {
          e.preventDefault();
          if (gameState !== 'PLAYING') {
            handleStart();
            return;
          }
          moveFrog(dir);
        };

        btn.addEventListener('touchstart', trigger, { passive: false });
        btn.addEventListener('mousedown', trigger);
      }

      bindBtn('btn-up', 'UP');
      bindBtn('btn-down', 'DOWN');
      bindBtn('btn-left', 'LEFT');
      bindBtn('btn-right', 'RIGHT');

      btnStart.addEventListener('click', handleStart);

      btnSound.addEventListener('click', () => {
        initAudio();
        soundEnabled = !soundEnabled;
        btnSound.textContent = soundEnabled ? '🔊' : '🔇';
      });

      // メインアニメーションループ
      function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        if (gameState !== 'PAUSED') {
          update(dt);
        }
        render();

        requestAnimationFrame(loop);
      }

      // 初期化実行
      resetGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
